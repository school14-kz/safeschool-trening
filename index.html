<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>🌿 Эко-битва</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b3d2e;
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* Анимированный фон */
  .bg {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0b3d2e, #145a43, #0b3d2e);
    background-size: 300% 300%;
    animation: bgShift 12s ease infinite;
    z-index: -1;
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    max-width: 720px;
    margin: 0 auto;
  }

  /* ==== СТАРТОВЫЙ ЭКРАН ==== */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  .start {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 24px;
  }

  .logo {
    font-size: clamp(48px, 15vw, 96px);
    animation: bounce 2s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  .title {
    font-size: clamp(32px, 9vw, 56px);
    font-weight: 900;
    margin: 0;
    line-height: 1.05;
    background: linear-gradient(135deg, #7cffc4, #4ad4ff, #ffe86b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 30px rgba(124, 255, 196, 0.3);
  }

  .subtitle {
    color: #8fd4b8;
    font-size: 16px;
    margin: -12px 0 0;
  }

  .mode-list { display: grid; gap: 12px; width: 100%; max-width: 340px; }

  .mode-btn {
    padding: 18px 20px;
    border: none;
    border-radius: 20px;
    font-size: 20px;
    font-weight: 800;
    color: #04281c;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.1s;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
  }
  .mode-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3); }

  .mode-water { background: linear-gradient(135deg, #4ad4ff, #2b9fff); }
  .mode-light { background: linear-gradient(135deg, #ffe86b, #ffb02b); }
  .mode-mix { background: linear-gradient(135deg, #7cffc4, #34d399); }

  /* ==== ИГРОВОЙ ЭКРАН ==== */
  .hud {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
  }

  .hud-pill {
    background: rgba(255, 255, 255, 0.1);
    padding: 8px 14px;
    border-radius: 99px;
    font-weight: 800;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(10px);
  }

  .hud-pill.streak { color: #ffe86b; }
  .hud-pill.streak.hot { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-3deg); }
    75% { transform: translateX(4px) rotate(3deg); }
  }

  /* Таймер */
  .timer-wrap {
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 99px;
    overflow: hidden;
    margin: 6px 4px 12px;
  }
  .timer-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #7cffc4, #4ad4ff);
    border-radius: 99px;
    transition: width 0.1s linear;
  }
  .timer-bar.warn { background: linear-gradient(90deg, #ffb02b, #ff6b6b); }
  .timer-bar.danger { background: #ff3b3b; animation: pulse 0.4s infinite alternate; }
  @keyframes pulse { to { opacity: 0.6; } }

  .question-emoji {
    font-size: 56px;
    text-align: center;
    margin: 0 0 8px;
    animation: pop 0.3s ease;
  }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .question-text {
    font-size: clamp(18px, 4.5vw, 22px);
    font-weight: 800;
    text-align: center;
    line-height: 1.3;
    margin: 0 0 16px;
    min-height: 2.6em;
  }

  .answers { display: grid; gap: 10px; flex: 1; align-content: start; }

  .answer {
    padding: 16px 18px;
    border: none;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    backdrop-filter: blur(6px);
    line-height: 1.3;
  }
  .answer:active:not(:disabled) { transform: scale(0.97); }
  .answer:disabled { cursor: default; }

  .answer.correct {
    background: linear-gradient(135deg, #34d399, #10b981);
    color: #04281c;
    animation: correctPop 0.4s;
  }
  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .answer.wrong {
    background: linear-gradient(135deg, #ff6b6b, #e83a3a);
    animation: wrongShake 0.4s;
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .answer.dim { opacity: 0.35; }

  /* Летящий +очки */
  .float-points {
    position: fixed;
    font-size: 32px;
    font-weight: 900;
    color: #7cffc4;
    pointer-events: none;
    z-index: 100;
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  @keyframes floatUp {
    from { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { transform: translateY(-20px) scale(1.3); opacity: 1; }
    to { transform: translateY(-120px) scale(1); opacity: 0; }
  }

  /* ==== РЕЗУЛЬТАТ ==== */
  .result {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
  }

  .result-emoji { font-size: 88px; animation: bounce 1s ease infinite; }
  .result-title {
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 900;
    margin: 0;
    background: linear-gradient(135deg, #7cffc4, #ffe86b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .result-score {
    font-size: 22px;
    color: #8fd4b8;
    font-weight: 700;
  }
  .result-score b { color: #7cffc4; font-size: 30px; }

  .btn-again {
    margin-top: 16px;
    padding: 18px 40px;
    border: none;
    border-radius: 20px;
    font-size: 20px;
    font-weight: 900;
    color: #04281c;
    background: linear-gradient(135deg, #7cffc4, #34d399);
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
  }
  .btn-again:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3); }

  .btn-home {
    margin-top: 8px;
    padding: 12px 24px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px;
    background: transparent;
    color: #8fd4b8;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Конфетти */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="confetti"></canvas>

  <div class="app">
    <!-- СТАРТ -->
    <div class="screen start active" id="screen-start">
      <div class="logo">🌿</div>
      <h1 class="title">Эко-битва</h1>
      <p class="subtitle">Проверь, сколько очков набьёшь за переменку!</p>
      <div class="mode-list">
        <button class="mode-btn mode-water" data-mode="water">💧 Вода</button>
        <button class="mode-btn mode-light" data-mode="light">💡 Свет</button>
        <button class="mode-btn mode-mix" data-mode="mix">🌍 Микс</button>
      </div>
    </div>

    <!-- ИГРА -->
    <div class="screen" id="screen-game">
      <div class="hud">
        <div class="hud-pill">🎯 <span id="score">0</span></div>
        <div class="hud-pill" id="progress">1/10</div>
        <div class="hud-pill streak" id="streak">🔥 0</div>
      </div>
      <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
      <div class="question-emoji" id="qEmoji">💧</div>
      <div class="question-text" id="qText"></div>
      <div class="answers" id="answers"></div>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="screen result" id="screen-result">
      <div class="result-emoji" id="rEmoji">🏆</div>
      <h2 class="result-title" id="rTitle">Молодец!</h2>
      <div class="result-score">Очки: <b id="rScore">0</b></div>
      <div class="result-score" id="rBest"></div>
      <button class="btn-again" id="againBtn">Играть ещё</button>
      <button class="btn-home" id="homeBtn">Выбрать режим</button>
    </div>
  </div>

<script>
/* ============ ЗВУК ============ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.type = type;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t);
  osc.stop(t + dur);
}
const sfx = {
  correct: () => { beep(880, 0.1); setTimeout(() => beep(1320, 0.15), 80); },
  wrong: () => beep(180, 0.3, 'sawtooth'),
  tick: () => beep(1000, 0.03, 'square', 0.04),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 100)); },
  lose: () => { [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle'), i * 120)); }
};

/* ============ КОНФЕТТИ ============ */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener('resize', resizeCanvas);
resizeCanvas();

function spawnConfetti(count = 60) {
  const colors = ['#7cffc4', '#4ad4ff', '#ffe86b', '#ff6b6b', '#c084fc', '#34d399'];
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 10;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      size: 5 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.4,
      life: 1
    });
  }
}
function loopConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.3;
    p.vx *= 0.99;
    p.rot += p.vr;
    p.life -= 0.012;
    if (p.life > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    }
  });
  particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 50);
  requestAnimationFrame(loopConfetti);
}
loopConfetti();

/* ============ ВОПРОСЫ ============ */
const EMOJIS = {

    { q: 'Сколько воды теряет капающий кран за сутки?', o: ['1 л', '5 л', '20 л', '100 л'], c: 2 },
    { q: 'Как мыть посуду экономнее?', o: ['Кран открыт', 'Закрывать между', 'Только горячей', 'По одной'], c: 1 },
    { q: 'Когда лучше поливать растения?', o: ['В полдень', 'Утром или вечером', 'В жару', 'В дождь'], c: 1 },
    { q: 'Сколько литров тратит человек в день?', o: ['10 л', '50 л', '150–200 л', '1000 л'], c: 2 },
    { q: 'Что такое «виртуальная вода»?', o: ['Из крана', 'Скрытая в вещах', 'В фонтане', 'Кипячёная'], c: 1 },
    { q: 'На одну футболку уходит воды...', o: ['10 л', '100 л', '2700 л', '50 л'], c: 2 },
    { q: 'Как мыть овощи экономнее?', o: ['Под струёй', 'В миске', 'Не мыть', 'Долго'], c: 1 },

    { q: 'Из крана капает. Что делать?', o: ['Терпеть', 'Починить', 'Открыть сильнее', 'Забыть'], c: 1 }
  ],
  light: [
    { q: 'Сколько свет летит от Солнца до Земли?', o: ['1 сек', '8 минут', '1 час', '1 день'], c: 1 },
    { q: 'Какая лампа экономичнее?', o: ['Накаливания', 'LED', 'Галогенная', 'С нитью'], c: 1 },
    { q: 'Кто изобрёл лампочку?', o: ['Только Эдисон', 'Более 20 человек', 'Ломоносов', 'В XXI веке'], c: 1 },
    { q: 'Выходишь из комнаты. Свет...', o: ['Оставить', 'Выключить', 'Ярче', 'Ещё лампу'], c: 1 },
    { q: 'Режим ожидания — это...', o: ['Полная мощность', 'Выключено', 'Тратит энергию', 'Зарядка'], c: 2 },

    { q: 'Как меньше включать свет днём?', o: ['Задёрнуть шторы', 'Открыть шторы', 'Все лампы', 'Закрыть окна'], c: 1 },

    { q: 'LED-лампа служит дольше обычной в...', o: ['2 раза', '5 раз', '10–25 раз', 'Не дольше'], c: 2 }
  ],
  mix: [
    { q: 'Правда или миф: горячая вода замерзает быстрее?', o: ['Миф', 'Правда'], c: 1 },
    { q: 'Сколько лет разлагается пластиковая бутылка?', o: ['1 год', '10 лет', '450 лет', 'Месяц'], c: 2 },
    { q: 'Что разлагается быстрее?', o: ['Пакет', 'Банановая кожура', 'Стекло', 'Банка'], c: 1 },

    { q: '♻️ на упаковке значит...', o: ['Брак', 'Переработка', 'Дорого', 'Нельзя'], c: 1 },
    { q: 'Сколько мусора в год у одного человека?', o: ['10 кг', '50 кг', '400 кг', '5 тонн'], c: 2 },
    { q: 'Куда деть ненужную вещь?', o: ['Выбросить', 'Отдать или сдать', 'Спрятать', 'Сжечь'], c: 1 },
    { q: 'Выключать воду при намыливании?', o: ['Нет', 'Да, экономия в разы', 'Иногда', 'Неважно'], c: 1 },
    { q: 'Правда или миф: из старой одежды делают новую?', o: ['Миф', 'Правда'], c: 1 },
    { q: 'Двусторонняя печать — это...', o: ['Плохо', 'Экономия бумаги', 'Дорого', 'Медленно'], c: 1 },
    { q: 'Что делать с лампой после использования?', o: ['В мусор', 'В спецпункт', 'Разбить', 'Закопать'], c: 1 }

/* ============ ИГРА ============ */
const TOTAL_QUESTIONS = 10;
const TIME_PER_Q = 15000; // 15 секунд

const state = {
  mode: 'mix',
  questions: [],
  index: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  correct: 0,
  timerId: null,
  timeLeft: 0,
  locked: false,
  best: Number(localStorage.getItem('ecoBest') || 0)
};

const $ = id => document.getElementById(id);

function show(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(screenId).classList.add('active');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame(mode) {
  initAudio();
  state.mode = mode;
  state.questions = shuffle(QUESTIONS[mode]).slice(0, TOTAL_QUESTIONS);
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.correct = 0;

  $('score').textContent = '0';
  $('streak').textContent = '🔥 0';
  show('screen-game');
  nextQuestion();
}

function nextQuestion() {
  clearInterval(state.timerId);
  state.locked = false;

  if (state.index >= state.questions.length) {
    endGame();
    return;
  }

  const q = state.questions[state.index];
  $('progress').textContent = `${state.index + 1}/${state.questions.length}`;

  const emojiList = EMOJIS[state.mode];
  $('qEmoji').textContent = emojiList[Math.floor(Math.random() * emojiList.length)];
  $('qText').textContent = q.q;

  const answersEl = $('answers');
  answersEl.innerHTML = '';
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = opt;
    btn.onclick = () => pickAnswer(i);
    answersEl.appendChild(btn);
  });

  // Таймер
  state.timeLeft = TIME_PER_Q;
  const bar = $('timerBar');
  bar.style.width = '100%';
  bar.className = 'timer-bar';

  const startedAt = Date.now();
  state.timerId = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    const percent = Math.max(0, 100 - (elapsed / TIME_PER_Q) * 100);
    bar.style.width = percent + '%';

    if (percent < 50 && percent > 20) bar.classList.add('warn');
    if (percent <= 20) { bar.classList.add('danger'); bar.classList.remove('warn'); }

    if (percent <= 0) {
      clearInterval(state.timerId);
      timeUp();
    }
  }, 50);
}

function pickAnswer(idx) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);

  const q = state.questions[state.index];
  const buttons = $('answers').querySelectorAll('.answer');
  const isCorrect = idx === q.c;

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.c) btn.classList.add('correct');
    else if (i === idx && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  if (isCorrect) handleCorrect(buttons[idx]);
  else handleWrong();

  setTimeout(() => {
    state.index++;
    nextQuestion();
  }, isCorrect ? 900 : 1400);
}

function timeUp() {
  if (state.locked) return;
  state.locked = true;
  const q = state.questions[state.index];
  const buttons = $('answers').querySelectorAll('.answer');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.c) btn.classList.add('correct');
    else btn.classList.add('dim');
  });
  handleWrong(true);
  setTimeout(() => {
    state.index++;
    nextQuestion();
  }, 1400);
}

function handleCorrect(btn) {
  sfx.correct();
  spawnConfetti(40);

  state.streak++;
  state.correct++;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;

  const base = 10;
  const bonus = state.streak >= 3 ? (state.streak - 2) * 5 : 0;
  const points = base + bonus;
  state.score += points;
  $('score').textContent = state.score;

  if (bonus > 0) {
    $('streak').textContent = `🔥 ${state.streak}`;
    $('streak').classList.add('hot');
    setTimeout(() => $('streak').classList.remove('hot'), 300);
  } else {
    $('streak').textContent = `🔥 ${state.streak}`;
  }

  // Летящий +очки
  const rect = btn.getBoundingClientRect();
  const fp = document.createElement('div');
  fp.className = 'float-points';
  fp.textContent = '+' + points;
  fp.style.left = rect.left + rect.width / 2 - 30 + 'px';
  fp.style.top = rect.top + 'px';
  document.body.appendChild(fp);
  setTimeout(() => fp.remove(), 900);
}

function handleWrong() {
  sfx.wrong();
  state.streak = 0;
  $('streak').textContent = '🔥 0';
}

function endGame() {
  const percent = state.correct / state.questions.length;
  let emoji, title;

  if (percent === 1) { emoji = '🏆'; title = 'Идеально!'; }
  else if (percent >= 0.7) { emoji = '🌟'; title = 'Супер!'; }
  else if (percent >= 0.4) { emoji = '👍'; title = 'Неплохо!'; }
  else { emoji = '💪'; title = 'Тренируйся!'; }

  $('rEmoji').textContent = emoji;
  $('rTitle').textContent = title;
  $('rScore').textContent = state.score;

  if (state.score > state.best) {
    state.best = state.score;
    localStorage.setItem('ecoBest', state.best);
    $('rBest').textContent = '🎉 Новый рекорд!';
    spawnConfetti(150);
    sfx.win();
  } else {
    $('rBest').textContent = `Рекорд: ${state.best}`;
    if (percent >= 0.7) sfx.win();
    else sfx.lose();
  }

  show('screen-result');
}

/* ============ ОБРАБОТЧИКИ ============ */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.mode));
});

$('againBtn').onclick = () => startGame(state.mode);
$('homeBtn').onclick = () => show('screen-start');
</script>
</body>
</html>
