<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>🌿 Эко-битва</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b3d2e;
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .bg {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0b3d2e, #145a43, #0b3d2e);
    background-size: 300% 300%;
    animation: bgShift 12s ease infinite;
    z-index: -1;
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    max-width: 720px;
    margin: 0 auto;
  }

  /* ВКЛАДКИ */
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border-radius: 14px;
    border: 2px solid transparent;
    background: rgba(255, 255, 255, 0.08);
    color: #b8e6d4;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab.active {
    background: rgba(124, 255, 196, 0.2);
    border-color: #7cffc4;
    color: #fff;
  }
  .tab:active { transform: scale(0.97); }

  /* СЛОЖНОСТЬ */
  .levels { display: flex; gap: 6px; margin-bottom: 8px; }
  .level {
    flex: 1;
    padding: 8px;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    background: transparent;
    color: #8fd4b8;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.15s;
  }
  .level.active {
    border-color: #7cffc4;
    color: #fff;
    background: rgba(124, 255, 196, 0.12);
  }
  .level.easy.active { border-color: #7cffc4; color: #7cffc4; }
  .level.hard.active { border-color: #ffb02b; color: #ffb02b; background: rgba(255, 176, 43, 0.12); }

  /* HUD */
  .hud {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px;
  }
  .hud-pill {
    background: rgba(255, 255, 255, 0.1);
    padding: 7px 12px;
    border-radius: 99px;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
    backdrop-filter: blur(10px);
  }
  .hud-pill.streak.hot { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-3deg); }
    75% { transform: translateX(4px) rotate(3deg); }
  }

  .timer-wrap {
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 99px;
    overflow: hidden;
    margin: 6px 0 10px;
  }
  .timer-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #7cffc4, #4ad4ff);
    border-radius: 99px;
    transition: width 0.1s linear;
  }
  .timer-bar.warn { background: linear-gradient(90deg, #ffb02b, #ff6b6b); }
  .timer-bar.danger { background: #ff3b3b; animation: pulse 0.4s infinite alternate; }
  @keyframes pulse { to { opacity: 0.6; } }

  .q-emoji {
    font-size: 40px;
    text-align: center;
    margin: 0 0 4px;
    animation: pop 0.3s ease;
  }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .q-text {
    font-size: clamp(16px, 4.2vw, 19px);
    font-weight: 800;
    text-align: center;
    line-height: 1.3;
    margin: 0 0 12px;
    min-height: 2.4em;
  }

  .answers { display: grid; gap: 8px; flex: 1; align-content: start; }
  .answer {
    padding: 14px 16px;
    border: none;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    backdrop-filter: blur(6px);
    line-height: 1.3;
  }
  .answer:active:not(:disabled) { transform: scale(0.97); }
  .answer:disabled { cursor: default; }
  .answer.correct {
    background: linear-gradient(135deg, #34d399, #10b981);
    color: #04281c;
    animation: correctPop 0.4s;
  }
  @keyframes correctPop { 50% { transform: scale(1.05); } }
  .answer.wrong {
    background: linear-gradient(135deg, #ff6b6b, #e83a3a);
    animation: wrongShake 0.4s;
  }
  @keyframes wrongShake {
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .answer.dim { opacity: 0.35; }

  .float-points {
    position: fixed;
    font-size: 30px;
    font-weight: 900;
    color: #7cffc4;
    pointer-events: none;
    z-index: 100;
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  @keyframes floatUp {
    from { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { transform: translateY(-20px) scale(1.3); opacity: 1; }
    to { transform: translateY(-120px) scale(1); opacity: 0; }
  }

  /* РЕЗУЛЬТАТ */
  .result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 20, 15, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
    text-align: center;
    z-index: 200;
    backdrop-filter: blur(10px);
  }
  .result-overlay.active { display: flex; }
  .r-emoji { font-size: 80px; animation: bounce 1s ease infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }
  .r-title {
    font-size: clamp(26px, 7vw, 38px);
    font-weight: 900;
    margin: 0;
    background: linear-gradient(135deg, #7cffc4, #ffe86b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .r-score { font-size: 20px; color: #8fd4b8; font-weight: 700; }
  .r-score b { color: #7cffc4; font-size: 28px; }
  .r-stats { font-size: 14px; color: #8fd4b8; }
  .btn-again {
    margin-top: 12px;
    padding: 16px 40px;
    border: none;
    border-radius: 18px;
    font-size: 18px;
    font-weight: 900;
    color: #04281c;
    background: linear-gradient(135deg, #7cffc4, #34d399);
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
  }
  .btn-again:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3); }

  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 199;
  }
</style>
</head>
<body>

<script>
/* ===== ЗВУК ===== */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.type = type;
  osc.connect(gain); gain.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur);
}
const sfx = {
  correct: () => { beep(880, 0.1); setTimeout(() => beep(1320, 0.15), 80); },
  wrong: () => beep(180, 0.3, 'sawtooth'),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2), i * 100)); },
  lose: () => { [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle'), i * 120)); }
};

/* ===== КОНФЕТТИ ===== */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resizeCanvas);
resizeCanvas();

function spawnConfetti(count = 50) {
  const colors = ['#7cffc4', '#4ad4ff', '#ffe86b', '#ff6b6b', '#c084fc', '#34d399'];
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 10;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 4,
      size: 5 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, life: 1
    });
  }
}
function loopConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.vx *= 0.99; p.rot += p.vr; p.life -= 0.012;
    if (p.life > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    }
  });
  particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 50);
  requestAnimationFrame(loopConfetti);
}
loopConfetti();

      { q: 'Сколько земли загрязняет одна батарейка?', o: ['Около 1 м²', 'Около 5 м²', 'Около 20 м²', 'Около 100 м²'], c: 2 },
      { q: 'Что можно сделать из 25 пластиковых бутылок?', o: ['Ничего полезного', 'Одну футболку', 'Игрушку', 'Тарелку'], c: 1 },
      { q: 'Какой пластик перерабатывается чаще всего?', o: ['PET (бутылки)', 'PVC', 'PS (пенопласт)', 'PLA'], c: 0 },
      { q: '«Углеродный след» — это...', o: ['След от обуви', 'Количество CO₂ от деятельности', 'След от машины', 'Вес мусора'], c: 1 },
      { q: 'Сколько энергии экономит переработка алюминиевой банки?', o: ['Около 10%', 'Около 50%', 'Около 95%', 'Около 100%'], c: 2 },
      { q: 'Что означает маркировка FSC на бумаге?', o: ['Брак', 'Древесина из ответственных источников', 'Дорогой товар', 'Синтетическая бумага'], c: 1 },
      { q: 'Компостирование — это...', o: ['Сжигание отходов', 'Переработка органики в удобрение', 'Закапывание мусора', 'Сортировка пластика'], c: 1 },
      { q: 'Сколько нефти нужно на одну пластиковую бутылку?', o: ['Не нужна', 'Около 10 мл', 'Около 100 мл', 'Около 1 л'], c: 1 },
      { q: 'Что такое «zero waste»?', o: ['Полный отказ от покупок', 'Стремление к нулевым отходам', 'Новый вид переработки', 'Завод без выбросов'], c: 1 }
    ]
  }
};

const TOPIC_EMOJI = {
  water: ['💧', '🚿', '🌊', '🚰', '🧊', '🌧️'],
  light: ['💡', '⚡', '🔋', '☀️', '🔌', '🌙'],
  mix: ['🌿', '♻️', '🌍', '🍀', '🌱', '🌞']
};

/* ===== ИГРА ===== */
const TOTAL = 10;
const TIME_PER_Q = 15000;

const state = {
  topic: 'water',
  level: 'easy',
  questions: [],
  index: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  correct: 0,
  timerId: null,
  locked: false
};

const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  initAudio();
  const pool = QUESTIONS[state.topic][state.level];
  state.questions = shuffle(pool).slice(0, Math.min(TOTAL, pool.length));
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.correct = 0;
  $('score').textContent = '0';
  $('streak').textContent = '🔥 0';
  $('resultOverlay').classList.remove('active');
  nextQuestion();
}

function nextQuestion() {
  clearInterval(state.timerId);
  state.locked = false;

  if (state.index >= state.questions.length) {
    endGame();
    return;
  }

  const q = state.questions[state.index];
  $('progress').textContent = `${state.index + 1}/${state.questions.length}`;

  const emojis = TOPIC_EMOJI[state.topic];
  $('qEmoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
  $('qText').textContent = q.q;

  const answersEl = $('answers');
  answersEl.innerHTML = '';
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = opt;
    btn.onclick = () => pickAnswer(i);
    answersEl.appendChild(btn);
  });

  const bar = $('timerBar');
  bar.style.width = '100%';
  bar.className = 'timer-bar';
  const startedAt = Date.now();
  state.timerId = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    const percent = Math.max(0, 100 - (elapsed / TIME_PER_Q) * 100);
    bar.style.width = percent + '%';
    if (percent < 50 && percent > 20) { bar.classList.add('warn'); bar.classList.remove('danger'); }
    if (percent <= 20) { bar.classList.add('danger'); bar.classList.remove('warn'); }
    if (percent <= 0) { clearInterval(state.timerId); timeUp(); }
  }, 50);
}

function pickAnswer(idx) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);
  const q = state.questions[state.index];
  const buttons = $('answers').querySelectorAll('.answer');
  const isCorrect = idx === q.c;

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.c) btn.classList.add('correct');
    else if (i === idx && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  if (isCorrect) handleCorrect(buttons[idx]);
  else handleWrong();

  setTimeout(() => { state.index++; nextQuestion(); }, isCorrect ? 900 : 1400);
}

function timeUp() {
  if (state.locked) return;
  state.locked = true;
  const q = state.questions[state.index];
  const buttons = $('answers').querySelectorAll('.answer');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.c) btn.classList.add('correct');
    else btn.classList.add('dim');
  });
  handleWrong();
  setTimeout(() => { state.index++; nextQuestion(); }, 1400);
}

function handleCorrect(btn) {
  sfx.correct();
  spawnConfetti(40);
  state.streak++;
  state.correct++;
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  const base = 10;
  const bonus = state.streak >= 3 ? (state.streak - 2) * 5 : 0;
  const points = base + bonus;
  state.score += points;
  $('score').textContent = state.score;
  $('streak').textContent = `🔥 ${state.streak}`;
  if (bonus > 0) {
    $('streak').classList.add('hot');
    setTimeout(() => $('streak').classList.remove('hot'), 300);
  }
  const rect = btn.getBoundingClientRect();
  const fp = document.createElement('div');
  fp.className = 'float-points';
  fp.textContent = '+' + points;
  fp.style.left = rect.left + rect.width / 2 - 30 + 'px';
  fp.style.top = rect.top + 'px';
  document.body.appendChild(fp);
  setTimeout(() => fp.remove(), 900);
}

function handleWrong() {
  sfx.wrong();
  state.streak = 0;
  $('streak').textContent = '🔥 0';
}

function endGame() {
  const percent = state.correct / state.questions.length;
  let emoji, title;
  if (percent === 1) { emoji = '🏆'; title = 'Идеально!'; }
  else if (percent >= 0.7) { emoji = '🌟'; title = 'Супер!'; }
  else if (percent >= 0.4) { emoji = '👍'; title = 'Неплохо!'; }
  else { emoji = '💪'; title = 'Тренируйся!'; }

  $('rEmoji').textContent = emoji;
  $('rTitle').textContent = title;
  $('rScore').textContent = state.score;
  $('rStats').textContent = `Правильно: ${state.correct} из ${state.questions.length} • Лучшая серия: ${state.bestStreak}`;

  if (percent >= 0.7) { spawnConfetti(150); sfx.win(); }
  else sfx.lose();

  $('resultOverlay').classList.add('active');
}

/* ===== ОБРАБОТЧИКИ ===== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.topic = tab.dataset.topic;
    startGame();
  });
});

document.querySelectorAll('.level').forEach(lvl => {
  lvl.addEventListener('click', () => {
    document.querySelectorAll('.level').forEach(l => l.classList.remove('active'));
    lvl.classList.add('active');
    state.level = lvl.dataset.level;
    startGame();
  });
});

$('againBtn').onclick = () => startGame();

startGame();
</script>
</body>
