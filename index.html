<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Эко-квест: вода и свет</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #e8f7ff 0%, #eafff1 100%);
    color: #1b2b24;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }
  .app { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  header h1 { margin: 0 0 8px; font-size: clamp(23px, 4vw, 34px); color: #0f5c46; }
  header p { margin: 0; color: #45685c; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .tab {
    padding: 11px 16px; border-radius: 12px; border: 1px solid #cde8dc;
    background: #fff; color: #23574a; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: .15s;
  }
  .tab:hover { background: #f1fff9; }
  .tab.active { background: #0f8a61; border-color: #0f8a61; color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: #fff; border-radius: 18px; padding: 22px;
    box-shadow: 0 10px 30px rgba(20, 80, 60, .09);
    border: 1px solid #d9f0e6;
  }
  .card h2 { margin: 0 0 6px; color: #0f5c46; font-size: 20px; }
  .quiz-progress { font-size: 14px; color: #5c7a70; margin-bottom: 14px; }
  .question { font-size: 18px; font-weight: 700; line-height: 1.35; margin-bottom: 14px; }
  .answers { display: grid; gap: 10px; }
  .answers button {
    width: 100%; text-align: left; padding: 12px 14px;
    border: 1px solid #cde8dc; border-radius: 12px;
    background: #f7fffb; color: #1b2b24; font-size: 15px; line-height: 1.35;
    cursor: pointer; transition: .15s;
  }
  .answers button:hover:not(:disabled) { background: #e9fff4; border-color: #7ccfaa; }
  .answers button:disabled { cursor: default; opacity: .95; }
  .answers button.correct { background: #d6ffe8; border-color: #34b878; font-weight: 700; }
  .answers button.wrong { background: #ffe2e2; border-color: #e05b5b; font-weight: 700; }

  .feedback {
    min-height: 40px; margin-top: 12px; padding: 10px 12px;
    border-radius: 12px; font-size: 14px; line-height: 1.45; display: none;
  }
  .feedback.ok { display: block; background: #e5fff1; color: #0d6b42; }
  .feedback.bad { display: block; background: #fff0f0; color: #a12c2c; }

  .btn {
    margin-top: 14px; padding: 12px 18px; border: none; border-radius: 12px;
    background: #0f8a61; color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: .15s;
  }
  .btn:hover:not(:disabled) { background: #0b6f4e; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: #0f5c46; border: 1px solid #b9ddcf; }
  .btn.ghost:hover { background: #f1fff9; }

  .quest-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .quest-step { font-size: 14px; color: #5c7a70; }
  .quest-points { font-size: 14px; font-weight: 700; color: #0f5c46; background: #e5fff1; padding: 6px 12px; border-radius: 99px; }
  .scene { font-size: 15px; color: #45685c; margin-bottom: 6px; }
  .situation { font-size: 18px; font-weight: 700; line-height: 1.35; margin-bottom: 14px; }
  .choices { display: grid; gap: 10px; }
  .choice {
    width: 100%; text-align: left; padding: 13px 14px;
    border: 1px solid #cde8dc; border-radius: 12px;
    background: #f7fffb; color: #1b2b24; font-size: 15px; line-height: 1.4;

  .result-text { color: #33584b; line-height: 1.55; margin: 0 0 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌿 Эко-переменка: вода и свет</h1>

      <div class="question"></div>
      <div class="answers"></div>
      <div class="feedback"></div>
      <button class="btn next-btn" disabled>Следующий вопрос</button>

  </section>

  <section class="panel" id="panel-light">
    <div class="card" id="quiz-light">
      <h2>💡 Викторина про свет и электричество</h2>
      <div class="quiz-progress"></div>
      <div class="question"></div>
      <div class="answers"></div>
      <div class="feedback"></div>
      <button class="btn next-btn" disabled>Следующий вопрос</button>
      <button class="btn ghost restart-btn" hidden>Пройти заново</button>
    </div>
  </section>

  <section class="panel" id="panel-habits">
    <div class="card" id="quiz-habits">
      <h2>🌍 Викторина про экопривычки</h2>
      <div class="quiz-progress"></div>
      <div class="question"></div>
      <div class="answers"></div>
      <div class="feedback"></div>
      <button class="btn next-btn" disabled>Следующий вопрос</button>
      <button class="btn ghost restart-btn" hidden>Пройти заново</button>
    </div>
  </section>

  <section class="panel" id="panel-quest">
    <div class="card" id="quest">
      <h2>🎮 Миссия «Один эко-день»</h2>
      <div class="bar"><div class="quest-bar-fill"></div></div>
      <div class="quest-head" style="margin-top:14px;">
        <div class="quest-step"></div>
        <div class="quest-points">0 эко-очков</div>
      </div>
      <div class="scene"></div>
      <div class="situation"></div>
      <div class="choices"></div>
      <div class="feedback"></div>
      <button class="btn quest-next" hidden>Дальше</button>
      <button class="btn ghost quest-restart" hidden>Пройти миссию заново</button>
    </div>
  </section>
</div>

<script>
function createQuiz(rootId, questions) {
  const root = document.getElementById(rootId);
  const progressEl = root.querySelector('.quiz-progress');
  const questionEl = root.querySelector('.question');
  const answersEl = root.querySelector('.answers');
  const feedbackEl = root.querySelector('.feedback');
  const nextBtn = root.querySelector('.next-btn');
  const restartBtn = root.querySelector('.restart-btn');

  let current = 0, score = 0, answered = false;

  function reset() {
    current = 0; score = 0; answered = false;
    restartBtn.hidden = true;
    nextBtn.hidden = false;
    nextBtn.disabled = true;
    nextBtn.textContent = 'Следующий вопрос';
    render();
  }

  function render() {
    answered = false;
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';

    if (current >= questions.length) { showResult(); return; }

    const item = questions[current];
    progressEl.textContent = `Вопрос ${current + 1} из ${questions.length}`;
    questionEl.textContent = item.q;
    answersEl.innerHTML = '';

    item.options.forEach((option, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = option;
      btn.addEventListener('click', () => choose(i, btn));
      answersEl.appendChild(btn);
    });

    nextBtn.disabled = true;
  }

  function choose(index, clicked) {
    if (answered) return;
    answered = true;

    const item = questions[current];
    const buttons = answersEl.querySelectorAll('button');
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === item.correct) btn.classList.add('correct');
    });

    if (index === item.correct) {
      score++;
      feedbackEl.textContent = '✅ Верно! ' + item.explain;
      feedbackEl.className = 'feedback ok';
    } else {
      clicked.classList.add('wrong');
      feedbackEl.textContent = '❌ Не совсем. ' + item.explain;
      feedbackEl.className = 'feedback bad';
    }
    nextBtn.disabled = false;
  }

  function showResult() {
    progressEl.textContent = 'Викторина завершена';
    answersEl.innerHTML = '';
    questionEl.textContent = `Результат: ${score} из ${questions.length}`;

    if (score === questions.length) {
      feedbackEl.textContent = '🏆 Идеально! Ты настоящий эко-эксперт!';
    } else if (score >= Math.ceil(questions.length * 0.7)) {
      feedbackEl.textContent = '🌿 Отлично! Ты знаешь очень много — расскажи друзьям.';
    } else if (score >= Math.ceil(questions.length / 2)) {
      feedbackEl.textContent = '👍 Хорошо! Большая часть фактов у тебя в кармане.';
    } else {
      feedbackEl.textContent = '💧 Есть куда расти — попробуй ещё раз, теперь ты знаешь больше!';
    }
    feedbackEl.className = 'feedback ok';
    nextBtn.hidden = true;
    restartBtn.hidden = false;
  }

  nextBtn.addEventListener('click', () => { current++; render(); });
  restartBtn.addEventListener('click', reset);
  reset();
}

function initQuest() {
  const root = document.getElementById('quest');
  const stepEl = root.querySelector('.quest-step');
  const pointsEl = root.querySelector('.quest-points');
  const sceneEl = root.querySelector('.scene');
  const situationEl = root.querySelector('.situation');
  const choicesEl = root.querySelector('.choices');
  const feedbackEl = root.querySelector('.feedback');
  const nextBtn = root.querySelector('.quest-next');
  const restartBtn = root.querySelector('.quest-restart');
  const barFill = root.querySelector('.quest-bar-fill');

  const maxPoints = questSteps.reduce((s, step) => s + Math.max(...step.choices.map(c => c.points)), 0);
  let index = 0, points = 0, answered = false;

  function updateBar() { barFill.style.width = (index / questSteps.length) * 100 + '%'; }

  function renderStep() {
    answered = false;
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    nextBtn.hidden = true;
    restartBtn.hidden = true;
    choicesEl.innerHTML = '';
    updateBar();

    if (index >= questSteps.length) { showResult(); return; }

    const step = questSteps[index];
    stepEl.textContent = `Ситуация ${index + 1} из ${questSteps.length}`;
    pointsEl.textContent = `${points} эко-очков`;
    sceneEl.textContent = step.scene;
    situationEl.textContent = step.situation;

    step.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice';
      btn.textContent = choice.text;
      btn.addEventListener('click', () => pick(choice, btn));
      choicesEl.appendChild(btn);
    });
  }

  function pick(choice, clicked) {
    if (answered) return;
    answered = true;
    points += choice.points;
    pointsEl.textContent = `${points} эко-очков`;
    choicesEl.querySelectorAll('.choice').forEach(b => b.disabled = true);
    clicked.classList.add(choice.type);
    feedbackEl.textContent = choice.feedback;
    feedbackEl.className = 'feedback ' + (choice.points >= 8 ? 'ok' : 'bad');
    nextBtn.hidden = false;
    nextBtn.textContent = index === questSteps.length - 1 ? 'Показать итог' : 'Дальше';
  }

  function showResult() {
    updateBar();
    barFill.style.width = '100%';
    stepEl.textContent = 'Миссия завершена';
    sceneEl.textContent = '';
    choicesEl.innerHTML = '';
    const percent = Math.round((points / maxPoints) * 100);
    let title, text;
    if (percent >= 90) { title = '🏆 Эко-герой!'; text = 'Ты экономишь воду и свет почти идеально. Так держать!'; }
    else if (percent >= 65) { title = '🌿 Хороший эко-результат'; text = 'Много верных решений. Осталось подтянуть пару привычек.'; }
    else if (percent >= 40) { title = '🙂 Неплохо, но есть рост'; text = 'Часть решений тратит ресурсы зря. Попробуй пройти миссию ещё раз.'; }
    else { title = '💧 Стоит потренироваться'; text = 'Много воды и энергии уходит впустую. Пройди миссию заново.'; }

    situationEl.innerHTML =
      `<div class="result-title">${title}</div>` +
      `<p class="result-text">${points} из ${maxPoints} эко-очков (${percent}%)</p>` +
      `<p class="result-text">${text}</p>`;
    restartBtn.hidden = false;
  }

  nextBtn.addEventListener('click', () => { index++; renderStep(); });
  restartBtn.addEventListener('click', () => {
    index = 0; points = 0;
    situationEl.textContent = '';
    renderStep();
  });
  renderStep();
}

initQuest();

    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});
